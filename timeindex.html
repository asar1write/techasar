<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TECH ASAR PROJECT - Limit Reached</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#818cf8; --primary-hover:#6366f1;
    --bg-main:#0f172a; --bg-gradient:radial-gradient(circle at 50% 0%, #1e1b4b 0%, #080f1e 100%);
    --card-bg:rgba(20,27,45,0.6); --text-main:#f8fafc; --text-muted:#94a3b8;
    --border-color:rgba(255,255,255,0.08);
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif;user-select:none;}
  body{
    background:var(--bg-main); background-image:var(--bg-gradient); color:var(--text-main);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .card{
    background:var(--card-bg); border:1px solid var(--border-color); border-radius:20px;
    padding:40px 30px; max-width:420px; width:100%; text-align:center;
    box-shadow:0 0 50px rgba(129,140,248,0.15), inset 0 0 20px rgba(129,140,248,0.05);
    backdrop-filter:blur(10px);
  }
  .lock-icon{
    width:70px; height:70px; margin:0 auto 20px; border-radius:50%;
    background:linear-gradient(135deg,#818cf8,#6366f1); display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 30px rgba(129,140,248,0.5);
  }
  .lock-icon svg{width:32px;height:32px;fill:#fff;}
  h1{
    font-family:'Montserrat',sans-serif; font-weight:900; font-size:22px; letter-spacing:1px;
    margin-bottom:10px; background:linear-gradient(120deg,#fceea7 0%,#ffffff 50%,#fceea7 100%);
    background-size:200% auto; -webkit-background-clip:text; color:transparent;
    animation:sweep 2.5s linear infinite;
  }
  @keyframes sweep{0%{background-position:-200% center;}100%{background-position:200% center;}}
  p.sub{color:var(--text-muted); font-size:14px; margin-bottom:25px; line-height:1.6;}
  .timer-box{
    background:rgba(0,0,0,0.35); border:1px solid var(--border-color); border-radius:14px;
    padding:18px; margin-bottom:20px;
  }
  .timer-label{font-size:12px; color:var(--text-muted); letter-spacing:2px; margin-bottom:8px; text-transform:uppercase;}
  .timer-value{
    font-family:'Montserrat',sans-serif; font-weight:900; font-size:34px; letter-spacing:3px;
    color:#38bdf8; text-shadow:0 0 15px rgba(56,189,248,0.5);
  }
  .free-time{font-size:13px; color:var(--text-muted); margin-top:6px;}
  .free-time span{color:var(--primary); font-weight:800;}
  footer{margin-top:10px; font-size:11px; color:var(--text-muted); letter-spacing:1px;}
</style>
</head>
<body>
  <div class="card">
    <div class="lock-icon">
      <svg viewBox="0 0 24 24"><path d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm-3 8V6a3 3 0 0 1 6 0v3z"/></svg>
    </div>
    <h1>TODAY LIMIT USED</h1>
    <p class="sub">आज की फ्री लिमिट खत्म हो चुकी है। कृपया नीचे दिए गए समय के बाद दोबारा प्रयास करें।</p>
    <div class="timer-box">
      <div class="timer-label">Next Free In</div>
      <div class="timer-value" id="countdown">--:--:--</div>
      <div class="free-time">Free time: <span id="freeTimeLabel">8:19 PM</span></div>
    </div>
    <footer>TECH ASAR PROJECT</footer>
  </div>

<script>
  // ⏰ Yahan target time change kar sakte ho (24-hour format: hour, minute)
  const TARGET_HOUR = 20;   // 8 PM
  const TARGET_MIN  = 19;   // 19 min

  function getNextTarget(){
    const now = new Date();
    let target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), TARGET_HOUR, TARGET_MIN, 0);
    if (now >= target) target.setDate(target.getDate() + 1); // agar time nikal gaya to kal ka target
    return target;
  }

  function pad(n){ return n.toString().padStart(2,'0'); }

  function updateCountdown(){
    const now = new Date();
    let target = getNextTarget();
    let diff = target - now;

    if (diff <= 0){
      document.getElementById('countdown').textContent = "00:00:00";
      // Limit khatam - yaha chaho to auto reload ya original site link daal sakte ho
      return;
    }

    const h = Math.floor(diff / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    document.getElementById('countdown').textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);
</script>
</body>
</html>
